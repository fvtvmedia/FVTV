name: Editorial or publishing deliverable
description: Track a magazine feature, review, Groover submission, newsletter item, or approved social campaign asset.
title: "[EDITORIAL] "
labels:
  - editorial
  - needs-triage
body:
  - type: input
    id: deliverable
    attributes:
      label: Deliverable
      description: Clear public-facing title.
    validations:
      required: true
  - type: dropdown
    id: format
    attributes:
      label: Format
      options:
        - Issue 005 feature
        - web article
        - review
        - Groover review
        - newsletter
        - social campaign
        - interview
        - other
    validations:
      required: true
  - type: textarea
    id: promise
    attributes:
      label: Public promise
      description: What the audience, artist, partner, or publication is actually promised.
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Sources and research
      description: URLs, source names, dates, author/handle, and limitations.
    validations:
      required: true
  - type: input
    id: due
    attributes:
      label: Publication or delivery date
      placeholder: YYYY-MM-DD
  - type: textarea
    id: assets
    attributes:
      label: Assets and rights
      description: Images, audio, links, clearances, embeds, and missing items.
  - type: dropdown
    id: disclosure
    attributes:
      label: Disclosure status
      options:
        - editorial / no paid relationship
        - paid promotion clearly labeled
        - sponsored campaign clearly labeled
        - affiliate or referral disclosure required
        - not yet determined
    validations:
      required: true
  - type: textarea
    id: qa
    attributes:
      label: QA checklist
      description: Fact-check, links, names, dates, rights, source attribution, and mobile/readability checks.
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: Editorial firewall
      options:
        - label: Paid placement does not control editorial ranking or coverage.
        - label: Claims are attributed and public-facing copy is ready or clearly marked as a placeholder.
        - label: Rights and disclosure requirements are recorded.
