name: Workflow bug
description: Report code, schema, CI, or technical workflow behavior that conflicts with the canonical system.
title: "[BUG] "
labels:
  - needs-triage
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction / evidence
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Duplicate, publishing, spending, or data risk
    validations:
      required: true
