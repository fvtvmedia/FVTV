name: Revenue lead
description: Qualify a service, ad, referral, affiliate, or partnership opportunity.
title: "[REVENUE] "
labels:
  - revenue
  - needs-triage
body:
  - type: input
    id: lead
    attributes:
      label: Lead or organization
    validations:
      required: true
  - type: dropdown
    id: lane
    attributes:
      label: Lane
      options:
        - FVTV Studios service
        - FVTV Media promotion
        - magazine ad
        - brand or event partnership
        - affiliate or referral
        - grant or funding
        - platform payout
        - other
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Buyer intent and source
      description: Quote the request or describe the source with a URL, thread ID, or CRM record.
    validations:
      required: true
  - type: input
    id: route
    attributes:
      label: Contact route
      placeholder: Email, platform, form, or CRM URL
    validations:
      required: true
  - type: input
    id: offer
    attributes:
      label: Approved offer or price
      placeholder: Example: $50/song mix + master
    validations:
      required: true
  - type: dropdown
    id: speed
    attributes:
      label: Time-to-cash
      options:
        - today
        - 2–7 days
        - 8–30 days
        - longer-term
        - unknown
    validations:
      required: true
  - type: dropdown
    id: readiness
    attributes:
      label: Fulfillment readiness
      options:
        - payment and scope ready
        - scope ready, payment pending
        - needs assets
        - needs owner decision
        - needs partner confirmation
        - discovery only
    validations:
      required: true
  - type: textarea
    id: next_action
    attributes:
      label: Next action
      description: One concrete action, owner, and date.
    validations:
      required: true
  - type: checkboxes
    id: safeguards
    attributes:
      label: Safeguards
      options:
        - label: This does not sell editorial rankings, favorable reviews, or guaranteed coverage.
        - label: Payment-before-work and approved-rate controls are understood.
        - label: Any legal, spending, barter, or binding gate is clearly identified.
