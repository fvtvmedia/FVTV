name: Partner or affiliate deliverable
description: Track an agreement, referral, affiliate, review, Groover, or partner commitment from intake to proof of completion.
title: "[PARTNER] "
labels:
  - partner
  - needs-triage
body:
  - type: input
    id: counterparty
    attributes:
      label: Partner or recipient
      description: Name and organization.
    validations:
      required: true
  - type: dropdown
    id: workstream
    attributes:
      label: Workstream
      options:
        - agreement
        - affiliate or referral
        - ad sale
        - service delivery
        - review
        - Groover
        - social campaign
        - other
    validations:
      required: true
  - type: textarea
    id: promise
    attributes:
      label: Exact commitment
      description: What FVTV promised or what the partner promised FVTV.
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Source and evidence
      description: Add the Notion URL, Gmail thread ID, agreement location, or public source.
    validations:
      required: true
  - type: input
    id: due_date
    attributes:
      label: Due date or next follow-up
      placeholder: YYYY-MM-DD
  - type: dropdown
    id: approval
    attributes:
      label: Approval state
      options:
        - not needed
        - owner approval needed
        - legal review needed
        - financial approval needed
        - approved
    validations:
      required: true
  - type: textarea
    id: assets
    attributes:
      label: Assets and access required
  - type: textarea
    id: delivery
    attributes:
      label: Delivery plan
      description: Route, recipient, message or file, and completion evidence.
    validations:
      required: true
  - type: checkboxes
    id: controls
    attributes:
      label: Controls
      options:
        - label: Editorial and paid-promotion boundaries are preserved.
        - label: No payment or revenue is counted without verification.
        - label: No confidential material is being committed to this public repository.
