name: Nia email ops tests

on:
  push:
    branches: [main]
    paths:
      - "ops/email/**"
      - "schemas/email-decision.schema.json"
  pull_request:
    branches: [main]
    paths:
      - "ops/email/**"
      - "schemas/email-decision.schema.json"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ops/email
    steps:
      - uses: actions/checkout@v4
      - name: Run decision engine tests
        run: python -m unittest -v test_decision_engine.py
